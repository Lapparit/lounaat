<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- Tietoturvasääntö (Content-Security-Policy): selain saa ladata vain tämän
     sivuston omia tiedostoja. Sivun sisään kirjoitettua JavaScriptiä ei
     suoriteta lainkaan, eikä sivu voi lähettää tietoa ulkopuolisille
     palvelimille. Suojaa siltä varalta, että jonkin ravintolan sivulta
     päätyisi haitallista sisältöä lounaslistaan. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<!-- Ei kerrota ravintoloiden sivuille, miltä sivulta kävijä tuli. -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3eee4">
<title>Lähilounaat Tampere</title>
<style>
  * { box-sizing: border-box; }

  /* TEEMA — lämmin pellava + sammalvihreä. Vain vaalea; ei puhdasta valkoista. */
  :root {
    color-scheme: light;
    --bg:            #f3eee4;
    --bg-elev:       rgba(243, 238, 228, 0.92);
    --bg-card:       #faf7f0;
    --bg-card-soft:  #efe9dc;
    --bg-input:      #faf7f0;
    --border:        #e2dac9;
    --border-strong: #cfc4ad;
    --divider:       #e9e2d3;
    --text:          #33302a;
    --text-2:        #605a4e;
    --text-3:        #8a8478;
    --accent:        #4f6f5c;
    --accent-strong: #3f5c4a;
    --accent-bg:     #dfe9df;
    --accent-text:   #32503e;
    --on-accent:     #f7f5ee;
    --star:          #c9932a;
    --warn-bg:       #f4e9cf;
    --warn-text:     #6f5416;
    --err:           #a8524f;
    --shadow:        0 1px 2px rgba(70, 60, 40, 0.05), 0 6px 16px -10px rgba(70, 60, 40, 0.22);
    --radius:        14px;
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    line-height: 1.5;
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
  }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Yläpalkki ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg-elev);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .top-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.6rem 1rem 0.55rem;
  }
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .brand h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand h1 span { color: var(--text-3); font-weight: 400; }
  .paivitetty {
    margin: 0;
    font-size: 0.75rem;
    color: var(--text-3);
    white-space: nowrap;
  }

  /* Vaakaan rullaavat siru-rivit */
  .chips {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 0.55rem 0 0.1rem;
    margin: 0 -1rem;
    padding-left: 1rem;
    padding-right: 1rem;
    scroll-snap-type: x proximity;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    scroll-snap-align: start;
    min-height: 40px;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--text-2);
    cursor: pointer;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .chip .pvm { font-size: 0.7rem; opacity: 0.8; }
  .chip .nimi { font-weight: 600; font-size: 0.9rem; }
  .chip.tanaan:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent-text); }
  .chip.tanaan .nimi::after { content: " •"; color: var(--accent); }
  .chip[aria-pressed="true"].tanaan .nimi::after { color: var(--on-accent); }

  /* ---------- Suodattimet ---------- */
  .suodattimet {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.75rem 1rem 0;
  }
  .haku {
    position: relative;
    display: flex;
    align-items: center;
  }
  .haku svg { position: absolute; left: 0.8rem; width: 18px; height: 18px; color: var(--text-3); pointer-events: none; }
  .haku input {
    width: 100%;
    min-height: 44px;
    padding: 0.55rem 2.6rem 0.55rem 2.5rem;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    font-size: 1rem;
    background: var(--bg-input);
    color: var(--text);
    -webkit-appearance: none;
  }
  .haku input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .haku .tyhjenna {
    position: absolute;
    right: 0.35rem;
    width: 36px; height: 36px;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-size: 1.25rem;
    line-height: 1;
  }
  .haku .tyhjenna:hover { background: var(--bg-card-soft); }
  .alueet .chip { min-height: 36px; padding: 0.25rem 0.8rem; font-size: 0.85rem; }

  .ilmoitus {
    max-width: 1200px;
    margin: 0.75rem auto 0;
    padding: 0 1rem;
  }
  .ilmoitus p {
    margin: 0;
    padding: 0.6rem 0.9rem;
    border-radius: 10px;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 0.85rem;
  }

  /* ---------- Sisältö ---------- */
  main { max-width: 1200px; margin: 0 auto; padding: 0.25rem 1rem 0; }

  .ryhma { margin-top: 1.4rem; }
  .ryhma-otsikko {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 0.7rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .ryhma-otsikko::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .ryhma-otsikko .lkm { font-weight: 400; letter-spacing: 0; text-transform: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 0.85rem;
    align-items: start;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  .kortti {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 0.9rem 1rem 1rem;
  }
  .kortti-ylä {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .kortti h3 {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .kortti h3 a { color: var(--text); text-decoration: none; }
  .kortti h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.6rem;
    margin: 0.15rem 0 0.7rem;
    font-size: 0.78rem;
    color: var(--text-3);
  }
  .meta a {
    color: var(--accent);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
  }
  .meta a:hover { text-decoration: underline; }
  .meta svg { width: 12px; height: 12px; }
  .vanha {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 0.72rem;
    font-weight: 500;
  }

  .tahti {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    margin: -0.4rem -0.5rem 0 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--border-strong);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tahti svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .tahti:hover { color: var(--star); background: var(--bg-card-soft); }
  .tahti[aria-pressed="true"] { color: var(--star); }
  .tahti[aria-pressed="true"] svg { fill: currentColor; }

  ul.ruoat {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.93rem;
    line-height: 1.45;
  }
  ul.ruoat li {
    padding: 0.38rem 0 0.38rem 1rem;
    position: relative;
    border-top: 1px solid var(--divider);
  }
  ul.ruoat li:first-child { border-top: 0; }
  ul.ruoat li::before {
    content: "";
    position: absolute;
    left: 0; top: 0.95em;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.7;
  }
  ul.ruoat li.osasto::before { display: none; }
  ul.ruoat li.valiotsikko {
    padding: 0.7rem 0 0.2rem;
    border-top: 0;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--accent-text);
  }
  ul.ruoat li.valiotsikko::before { display: none; }
  ul.ruoat li.valiotsikko:first-child { padding-top: 0.1rem; }
  ul.ruoat li.valiotsikko + li { border-top: 0; }
  ul.ruoat li.alarivi {
    border-top: 0;
    padding: 0.05rem 0 0.3rem 1.9rem;
    margin-top: -0.25rem;
    color: var(--text-2);
    font-size: 0.88rem;
  }
  ul.ruoat li.alarivi::before {
    width: 6px; height: 1px; border-radius: 0;
    left: 1.1rem; top: 0.85em;
  }
  ul.ruoat li.osasto { padding-left: 0; }
  ul.ruoat li .osasto-nimi {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 0.05rem;
  }
  mark { background: var(--accent-bg); color: var(--accent-text); border-radius: 3px; padding: 0 1px; }

  .huom {
    color: var(--text-2);
    font-size: 0.9rem;
    margin: 0;
  }
  .virhe { color: var(--err); }

  .linkkinappi {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.7rem;
    min-height: 40px;
    padding: 0.4rem 0.9rem;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card-soft);
    color: var(--accent-text);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
  }
  .linkkinappi:hover { border-color: var(--accent); }
  .linkkinappi svg { width: 14px; height: 14px; }

  /* Tiiviit kortit: ei listaa (vain linkki) */
  .kortti.tiivis {
    background: var(--bg-card-soft);
    box-shadow: none;
    border-style: dashed;
    padding: 0.7rem 0.9rem 0.8rem;
  }
  .kortti.tiivis h3 { font-size: 0.98rem; }
  .kortti.tiivis .meta { margin-bottom: 0.35rem; }
  .kortti.tiivis .huom { font-size: 0.83rem; }
  .kortti.tiivis .linkkinappi { margin-top: 0.5rem; min-height: 36px; padding: 0.3rem 0.75rem; font-size: 0.82rem; }

  .tyhja {
    text-align: center;
    color: var(--text-3);
    padding: 3rem 1rem;
  }
  .tyhja button {
    margin-top: 0.75rem;
    min-height: 40px;
    padding: 0.4rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    cursor: pointer;
  }

  footer {
    max-width: 1200px;
    margin: 2.5rem auto 0;
    padding: 0 1rem;
    text-align: center;
    color: var(--text-3);
    font-size: 0.78rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Sivun alkuun -nappi oikeassa alanurkassa. Näkyy vasta kun sivua on
     rullattu alaspäin (app.js lisää luokan "nakyvissa"). */
  .ylos {
    position: fixed;
    right: max(1rem, env(safe-area-inset-right));
    bottom: max(1rem, env(safe-area-inset-bottom));
    z-index: 20;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--accent-strong);
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 2px 4px rgba(50, 40, 20, 0.15), 0 8px 20px -8px rgba(50, 40, 20, 0.4);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ylos.nakyvissa { opacity: 1; transform: none; pointer-events: auto; }
  .ylos:hover { background: var(--accent-strong); }
  .ylos svg { width: 22px; height: 22px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (min-width: 700px) {
    .brand h1 { font-size: 1.5rem; }
    .top-inner { padding-top: 0.85rem; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Lähilounaat <span>Tampere</span></h1>
      <p class="paivitetty" id="paivitetty">Ladataan…</p>
    </div>
    <div class="chips" id="paivat" role="group" aria-label="Valitse päivä"></div>
  </div>
</header>

<section class="suodattimet" aria-label="Suodattimet">
  <div class="haku">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="haku" placeholder="Etsi ruokaa tai ravintolaa…" autocomplete="off" aria-label="Etsi ruokaa tai ravintolaa">
    <button class="tyhjenna" id="tyhjenna" type="button" aria-label="Tyhjennä haku" hidden>×</button>
  </div>
  <div class="chips alueet" id="alueet" role="group" aria-label="Rajaa alueen mukaan"></div>
</section>

<div class="ilmoitus" id="ilmoitus" hidden></div>

<main id="lista"><p class="tyhja">Ladataan lounaslistoja…</p></main>

<footer>
  Tiedot kerätty automaattisesti ravintoloiden omilta sivuilta ja
  <a href="https://lounaat.info" target="_blank" rel="noopener">lounaat.infosta</a>.
  Tarkista aina ravintolan sivulta.
</footer>

<button id="ylos" class="ylos" type="button" aria-label="Takaisin sivun alkuun" title="Sivun alkuun">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="app.js"></script>
</body>
</html>
